<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    #card {
      position: fixed; inset: 0; margin: 4px;
      background: rgba(18, 14, 38, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      display: flex; flex-direction: column; overflow: hidden;
      animation: pop 0.18s ease;
    }
    @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 8px;
      background: linear-gradient(135deg, rgba(124,58,237,0.5), rgba(219,39,119,0.4));
      cursor: move; user-select: none; -webkit-user-select: none; flex-shrink: 0;
    }
    #head .t { color: #fff; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    #head .btns { display: flex; gap: 3px; }
    #head button {
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      font-size: 10px; width: 18px; height: 18px; border-radius: 4px;
      cursor: pointer; line-height: 1; padding: 0;
    }
    #head button:hover { background: rgba(255,255,255,0.3); }
    #close:hover { background: rgba(239,68,68,0.7); }
    #body { padding: 5px 9px 7px; flex: 1; overflow-y: auto; color: #f0eefc; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    #body .src { color: rgba(240, 238, 252, 0.5); font-size: 11px; margin-bottom: 3px; padding-bottom: 3px; border-bottom: 1px dashed rgba(255,255,255,0.12); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    #body .dst { color: #fff; font-size: 13px; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="card">
    <div id="head">
      <span class="t">🦋 实时翻译</span>
      <div class="btns">
        <button id="pin" title="置顶开关">📌</button>
        <button id="quit" title="退出个人精灵">⏻</button>
        <button id="close" title="关闭这次译文">✕</button>
      </div>
    </div>
    <div id="body">
      <div id="src" class="src" style="display:none"></div>
      <div id="dst" class="dst"></div>
    </div>
  </div>

  <script>
    const api = window.__TAURI__;
    const srcEl = document.getElementById("src");
    const dstEl = document.getElementById("dst");
    let pinned = true;

    api.event.listen("translate-result", (e) => {
      const { text, translated } = e.payload;
      srcEl.style.display = "block";
      srcEl.textContent = "📋 " + (text.length > 80 ? text.slice(0, 80) + "…" : text);
      dstEl.textContent = translated;
    });

    document.getElementById("head").addEventListener("mousedown", (e) => {
      if (e.target.id === "close" || e.target.id === "pin" || e.target.id === "quit") return;
      api.window.getCurrentWindow().startDragging();
    });

    document.getElementById("close").addEventListener("click", async () => {
      await api.window.getCurrentWindow().hide();
    });

    document.getElementById("quit").addEventListener("click", async () => {
      await api.core.invoke("quit_app");
    });

    document.getElementById("pin").addEventListener("click", async () => {
      pinned = !pinned;
      await api.window.getCurrentWindow().setAlwaysOnTop(pinned);
    });
  </script>
</body>
</html>
